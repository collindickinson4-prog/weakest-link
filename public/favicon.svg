<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- deep-blue studio glow, same palette as .wl-stage -->
    <radialGradient id="stage" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2a6ed2"/>
      <stop offset="45%" stop-color="#0c285f"/>
      <stop offset="100%" stop-color="#02040f"/>
    </radialGradient>
    <!-- metallic blue bevel, same stops as .wl-metal -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3ff"/>
      <stop offset="18%" stop-color="#bcd6ff"/>
      <stop offset="52%" stop-color="#4f8fe0"/>
      <stop offset="60%" stop-color="#2a5fb0"/>
      <stop offset="78%" stop-color="#87b6f0"/>
      <stop offset="100%" stop-color="#e8f2ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#stage)"/>

  <!-- starburst rays -->
  <g stroke="#78b4ff" stroke-opacity="0.22" stroke-width="1.6">
    <line x1="32" y1="32" x2="32" y2="6"/>
    <line x1="32" y1="32" x2="54" y2="13"/>
    <line x1="32" y1="32" x2="58" y2="32"/>
    <line x1="32" y1="32" x2="54" y2="51"/>
    <line x1="32" y1="32" x2="32" y2="58"/>
    <line x1="32" y1="32" x2="10" y2="51"/>
    <line x1="32" y1="32" x2="6" y2="32"/>
    <line x1="32" y1="32" x2="10" y2="13"/>
  </g>

  <!-- tilted orbit ring with glow -->
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="18" fill="none" stroke="#50a0ff" stroke-opacity="0.35" stroke-width="5"/>
    <ellipse cx="32" cy="32" rx="27" ry="18" fill="none" stroke="#96d2ff" stroke-opacity="0.85" stroke-width="2"/>
  </g>

  <!-- WL wordmark -->
  <text x="32" y="43" text-anchor="middle"
        font-family="Anton, 'Arial Black', 'Segoe UI', sans-serif" font-weight="900"
        font-size="30" fill="url(#metal)" stroke="#0a1e46" stroke-opacity="0.6" stroke-width="1"
        letter-spacing="0.5">WL</text>
</svg>
